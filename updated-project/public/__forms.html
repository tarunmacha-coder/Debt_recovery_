<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Forms</title>
</head>
<body>
  <!--
    Build-time skeletons for Netlify Forms. The real forms are rendered by
    React (src/components/Demo.jsx and src/components/JobCard.jsx) and post
    here. Field names must match what those components submit.
  -->
  <form name="book-demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="book-demo">
    <input name="bot-field">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <input type="text" name="company">
    <textarea name="message"></textarea>
  </form>

  <form name="job-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="job-application">
    <input name="bot-field">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <input type="text" name="position">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
